# import 경로 문제 해결용 최소 설정
#
# 이 파일이 없으면:
#   - `pytest` 실행 시 ModuleNotFoundError: No module named 'src'
#   - `python app/app.py` 실행 시 같은 에러
# pythonpath = ["."] 가 프로젝트 루트를 import 경로에 넣어줍니다.

[project]
name = "ls-jumpup-pdm"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["archive", "notebooks"]

[tool.ruff.lint]
# 실제 오류만 잡는다: 문법·정의되지 않은 이름·쓰지 않는 import/변수(E4·E7·E9·F).
select = ["E4", "E7", "E9", "F"]
# 짧은 반복 변수(l 등)는 기존 코드 관례라 허용한다.
ignore = ["E741"]
