name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows 러너의 기본 콘솔 코드페이지(cp1252 등)로는 한글 print가
      # UnicodeEncodeError를 낸다. Python을 UTF-8 모드로 강제해 OS와 무관하게
      # 동일한 인코딩으로 동작하게 한다 (PEP 540, Python 3.7+).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.16.10
      - run: ruff check .                     # 문법·정의되지 않은 이름·쓰지 않는 import (pyproject.toml [tool.ruff])
      - run: python -c "import src.wireframe_app"   # 대시보드 앱 import 가능한지(DB·로그인 없음)
      - run: pytest -q
      - run: python -m scripts.check_env      # prophet이 설치만으로 도는지 (윈도우/맥 실제 동일 조건 검증)
        continue-on-error: true               # prophet 검증은 우선 관찰만; 실패해도 CI 전체를 막지 않음
